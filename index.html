<!DOCTYPE html>
<html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header{
                background-color: rgb(40, 97, 182);
                color: rgb(255, 255, 255);
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            } 
            main {
                background-color: aliceblue;
                color: #1e67bb;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                 padding: 16px;
            }
          article 
            img{ 
                width: 100px;
                height: 100px;
            }
           .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu Blog Tech</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologias e programações</p>
        </header>
            <main>
                <article> 
                    <img src="blog.imagem.png" alt="Um emblema quadrado de cor azul-marinho e branco que exibe no centro um livro aberto com páginas compostas por circuitos e uma lâmpada com um "E" dentro, e nas bordas, "TECH EDU" acima e "INOVAÇÃO NO APRENDIZADO" abaixo, em um fundo azul-marinho e branco.">
                       <div>
                    <h2>Meu primeiro post</h2>
                    <p class="artigo-autor">por:Gabriel Henrique</p>
                    <p>Boas Vindas ao meu novo Blog! Aqui vou compartilhar dicas de programaçâo e curiosidades da área de tecnologia.
                    </p>
                    <button>👍<span>0</span></button>
                    <button>👎<span>0</span></button>
                    </div>

                </article>
            </main>
       </body>
       <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( function (botao) {
            botao.addEventListener("click",botaoClicado);
            console.log("fui clicado");
            function botaoClicado(){
                let texto = botao.querySelector("span");
                texto.textContent++;

        }
    })

       </script>
</html>
